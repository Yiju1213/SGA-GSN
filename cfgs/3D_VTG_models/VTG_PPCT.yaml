optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.000050,  # original 0.0001
  weight_decay : 0.0005
}}

scheduler: {
  type: LambdaLR,
  kwargs: {
  decay_step: 5, 
  lr_decay: 0.80, # original 0.85 
  lowest_decay: 0.02  # min lr = lowest_decay * lr
}}

bnmscheduler: {
  type: Lambda,
  kwargs: {
  decay_step: 10, # original 10
  bn_decay: 0.5,
  bn_momentum: 0.9,
  lowest_decay: 0.01
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/VTG3D.yaml, 
            others: {subset: 'train'}},
  val : { _base_: cfgs/dataset_configs/VTG3D.yaml, 
            others: {subset: 'test'}},
  test : { _base_: cfgs/dataset_configs/VTG3D.yaml, 
            others: {subset: 'test'}}}
            
grasp_model : {
    NAME: SGSNet, 
    # manager for grasp stability loss
    loss_manager: {},

    # whether to use self-build visual encoder instead of AdaPoinTr output
    use_vis_encoder: True,

    # Point sequence dropout configuration for both visual and contact features
    use_vis_seq_shuf_drop: True, # Whether to use visual sequence dropout and shuffle
    vis_seq_drop_rate: [0.10, 0.20], # still > 96
    use_tac_seq_shuf_drop: True, # Whether to use contact sequence dropout and shuffle
    tac_seq_drop_rate: [0.10, 0.20], # Contact dropout rate (disabled by default)

    # Shared position encoder configuration
    use_shared_pos_embed: True, # Whether to share position encoding parameters between visual and tactile encoders
    
    tactile_encoder: {
      input_dim: 4, # xyz + contact binary
      proxy_num: [256, 128],
      transformer: {
        embed_dim: 384,
        depth: 4, # original 6
        num_heads: 6,
        k: 8,
        n_group: 2, # for `DeformableAttention`, can be omit
        mlp_ratio: 2., # size of mlp layer relative to embed dim
        drop_rate: 0.2,
        attn_drop_rate: 0.2,
        block_style_list: ['attn-graph', 'attn', 'attn', 'attn'], 
        combine_style: 'concat',
      },
    },

    visual_encoder: { # only for mem_link and ablation study
      input_dim: 3, # xyz 
      proxy_num: [256, 128],
      transformer: {
        embed_dim: 384,
        depth: 4, # original 6
        num_heads: 6,
        k: 8,
        n_group: 2, # for `DeformableAttention`, can be omit
        mlp_ratio: 2., # size of mlp layer relative to embed dim
        drop_rate: 0.2,
        attn_drop_rate: 0.2,
        block_style_list: ['attn-graph', 'attn', 'attn', 'attn'], 
        combine_style: 'concat',
      },
    },

    # feature_fusion: {
    #   #
    #   input_dim: 384, # original 384
    #   embed_dims: [384, 384, 448, 448, 512, 512, 576, 576], # Input dimension of CrossAttn for current layer(support changing per layer)
    #   depth: 8,
    #   num_heads: [6, 6, 7, 7, 8, 8, 9, 9], # support changing per layer
    #   k: 8, # original 8
    #   n_group: 2,
    #   mlp_ratio: 2.,
    #   drop_rate: 0.2,
    #   attn_drop_rate: 0.2,
    #   drop_path_rate: 0.1,
    #   #
    #   # Downsampling configuration - supports two methods:
    #   # note: q for tac, v for vis
    #   enable_downsample_q: False,  # Whether to downsample query points(the v are surely downsampled, so no need to specify)
    #   downsample_points: [96, 96, 64, 64, 32, 32, 16, 16],  # Recommended: directly specify target point count
    #   # downsample_ratios: [0.5, 0.5, 0.5, 1.0]  # Or use ratios (backward compatible)
    #   downsample_k: 8,
    #   graph_aggregation_method: 'mean',
    #   #
    #   self_attn_block_style_list: ['attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn'],
    #   self_attn_combine_style: 'concat',
    #   cross_attn_block_style_list: ['attn-graph', 'attn', 'attn-graph', 'attn', 'attn-graph', 'attn', 'attn-graph', 'attn'],  # If not expressive enough, add -graph to first layer
    #   cross_attn_combine_style: 'concat',
    #   #
    #   multi_scale_aggregation: False,
    #   multi_scale_aggregation_method: 'weighted_sum',
    #   multi_scale_aggregation_layers: [1, 3, 5],
    # },

    # pred_head_drop_rate: 0.2,
    # pred_head_mid_feature: 256,

    # ablation: {
    
    # },

    feature_fusion: {
      #
      input_dim: 384, # original 384
      embed_dims: [384, 384, 448, 448, 512, 512], # Input dimension of CrossAttn for current layer(support changing per layer)
      depth: 6,
      num_heads: [6, 6, 7, 7, 8, 8], # support changing per layer
      k: 8, # original 8
      n_group: 2,
      mlp_ratio: 2.,
      drop_rate: 0.2,
      attn_drop_rate: 0.2,
      drop_path_rate: 0.1,
      #
      # Downsampling configuration - supports two methods:
      # note: q for tac, v for vis
      enable_downsample_q: False,  # Whether to downsample query points(the v are surely downsampled, so no need to specify)
      downsample_points: [96, 96, 64, 64, 32, 32],  # Recommended: directly specify target point count
      # downsample_ratios: [0.5, 0.5, 0.5, 1.0]  # Or use ratios (backward compatible)
      downsample_k: 8,
      graph_aggregation_method: 'mean',
      #
      self_attn_block_style_list: ['attn', 'attn', 'attn', 'attn', 'attn', 'attn'],
      self_attn_combine_style: 'concat',
      cross_attn_block_style_list: ['attn-graph', 'attn', 'attn-graph', 'attn', 'attn-graph', 'attn'],  # If not expressive enough, add -graph to first layer
      cross_attn_combine_style: 'concat',
      #
      multi_scale_aggregation: False,
      multi_scale_aggregation_method: 'weighted_sum',
      multi_scale_aggregation_layers: [1, 3, 5],
    },

    pred_head_drop_rate: 0.2,
    pred_head_mid_feature: 256,

    ablation: {
    
    },
    
}

shape_model : {
    NAME: AdaPoinTr, 
    num_query: 512, 
    num_points: 8192,
    center_num: [256, 128],
    global_feature_dim: 1024, 
    encoder_type: graph,
    decoder_type: fc,
    encoder_config: {
      embed_dim: 384,
      depth: 6,
      num_heads: 6,
      k: 8,
      n_group: 2,
      mlp_ratio: 2.,
      block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn'], 
      combine_style: 'concat',
    },
    decoder_config: {
      embed_dim: 384,
      depth: 8,
      num_heads: 6,
      k: 8,
      n_group: 2,
      mlp_ratio: 2.,
      self_attn_block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn'], 
      self_attn_combine_style: 'concat',
      cross_attn_block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn'], 
      cross_attn_combine_style: 'concat',
    }
}

# ablation experiment
ablation: {
  direct_concat: False,
  full_shape_input: False, # use full shape input
  without_spatial_align: False, # without spatial alignment
  without_shape_completion: False, # without shape completion
}

train_data_ratio: 0.75 # 1.0 for 5k/obj, 0.75 for 3.75k/obj, 0.5 for 2.5k/obj, 0.25 for 1.25k/obj
total_bs : 72
step_per_update : 1
max_epoch : 30

consider_metric: AvgAcc
