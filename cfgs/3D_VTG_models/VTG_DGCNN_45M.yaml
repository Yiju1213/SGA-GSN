optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.000080,
  weight_decay : 0.0005
}}

scheduler: {
  type: LambdaLR,
  kwargs: {
  decay_step: 5,
  lr_decay: 0.85,
  lowest_decay: 0.02  # min lr = lowest_decay * lr
}}

bnmscheduler: {
  type: Lambda,
  kwargs: {
  decay_step: 10,
  bn_decay: 0.5,
  bn_momentum: 0.9,
  lowest_decay: 0.01
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/VTG3D.yaml,
            others: {subset: 'train'}},
  val : { _base_: cfgs/dataset_configs/VTG3D.yaml,
            others: {subset: 'test'}},
  test : { _base_: cfgs/dataset_configs/VTG3D.yaml,
            others: {subset: 'test'}}}

# NOTE: DGCNN backbones accept (B, N, C) or (B, C, N). Tactile and shape
# inputs can be 4-dim (xyz + contact/local-density) by setting input_dim: 4.
grasp_model : {
    NAME: DGCNNGraspStability,
    loss_manager: {},
    HIDDEN_DIM: 256,
    OUT_DIM: 1,
    DROPOUT: 0.2,
    VIS_GROUPER: {
      input_dim: 3, # xyz only
      proxy_num: [256, 128]
    },
    TAC_GROUPER: {
      input_dim: 4, # xyz + contact binary
      proxy_num: [256, 128]
    },
    VIS_BACKBONE: {
      # input_dim: 3, follows grouper output
      k: 20,
      emb_dims: 4096, 
      # conv_channels: [64, 64, 128, 256],
      conv_channels: [256, 512, 1024, 2048], 
    },
    TAC_BACKBONE: {
      # input_dim: 4, follows grouper output
      k: 20,
      emb_dims: 4096, 
      # conv_channels: [64, 64, 128, 256],
      conv_channels: [256, 512, 1024, 2048],
    }
}
