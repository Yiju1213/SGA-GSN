shape_model : {
    NAME: AdaPoinTr,
    num_query: 512,
    num_points: 8192,
    center_num: [256, 128],
    global_feature_dim: 1024,
    encoder_type: graph,
    decoder_type: fc,
    encoder_config: {
      embed_dim: 384,
      depth: 6,
      num_heads: 6,
      k: 8,
      n_group: 2,
      mlp_ratio: 2.,
      block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn'],
      combine_style: 'concat',
    },
    decoder_config: {
      embed_dim: 384,
      depth: 8,
      num_heads: 6,
      k: 8,
      n_group: 2,
      mlp_ratio: 2.,
      self_attn_block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn'],
      self_attn_combine_style: 'concat',
      cross_attn_block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn'],
      cross_attn_combine_style: 'concat',
    }
}

ablation: {
  direct_concat: False,
  full_shape_input: False,
  without_spatial_align: False,
  without_shape_completion: False
}

train_data_ratio: 0.75
total_bs : 32
step_per_update : 1
max_epoch : 30

consider_metric: AvgAcc
